[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plane-mcp-bridge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mcp==1.29.0", "PyJWT[crypto]==2.13.0", "httpx>=0.27,<1"]

[project.scripts]
plane-mcp-bridge = "plane_mcp_bridge.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/plane_mcp_bridge"]
